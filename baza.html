<!doctype html>
<html lang="kk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>JUZDEREK — База қалыптастыру</title>
  <link rel="stylesheet" href="./site-header.css?v=20260903-baza3">
  <link rel="stylesheet" href="./profile-menu.css?v=20260903-baza3">
  <link rel="stylesheet" href="./next-ux.css?v=20260819-01">
  <link rel="stylesheet" href="./baza.css?v=20260903-baza3">
</head>
<body>
  <header class="site-header" data-site-header></header>
  <main class="baza-page">
    <section class="baza-shell" aria-labelledby="baza-title">
      <div class="baza-topline"><div><span class="baza-kicker">JUZDEREK</span><h1 id="baza-title">База қалыптастыру</h1><p>Аптаның тақырыптарын араластырып, негізгі сұрақтарды еске түсір.</p></div></div>
      <article class="question-card" aria-live="polite">
        <div class="question-card__head"><div class="counter-wrap"><strong id="questionIndex">01</strong><span>/</span><span id="questionTotal">15</span></div></div>
        <div class="progress-track" aria-hidden="true"><span id="progressBar"></span></div>
        <div class="question-stage">
          <div class="question-icon">?</div><h2 id="questionText"></h2>
          <div class="answer-panel" id="answerPanel" hidden><span>Дұрыс жауап</span><div id="answerText"></div></div>
          <div class="hint-row" id="hintRow"><span class="hint-icon">♧</span><span>Жауапты есіңе түсіріп, дайын болған соң тексер.</span></div>
          <button class="reveal-button" id="revealButton" type="button"><span class="eye-icon" aria-hidden="true">◉</span><span>Жауапты көру</span></button>
        </div>
        <div class="self-check" id="selfCheck" aria-label="Өзіндік бағалау">
          <button class="choice-button choice-button--repeat" id="repeatButton" type="button" disabled><span aria-hidden="true">↻</span><span>Қайталаймын</span></button>
          <button class="choice-button choice-button--know" id="knowButton" type="button" disabled><span aria-hidden="true">✓</span><span>Білдім</span></button>
        </div>
      </article>
      <div class="demo-note" id="sessionNote"><strong>15 сұрақ.</strong><span>Төрт тақырып бір нұсқада аралас келеді.</span></div>
    </section>
  </main>
  <script src="./site-header-component.js?v=20260903-baza3"></script>
  <script src="./baza.js?v=20260903-baza3"></script>
</body>
</html>
