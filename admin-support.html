<!doctype html><html lang="kk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>JUZDEREK — Support Admin</title><style>body{margin:0;background:#f5f6f8;color:#252a31;font-family:Arial,sans-serif}.admin-shell{max-width:1180px;margin:0 auto;padding:24px}.admin-head{display:flex;justify-content:space-between;gap:20px;align-items:center;margin-bottom:18px}.admin-head h1{margin:0;font-size:30px}.admin-head p{margin:5px 0 0;color:#7d848d}.admin-auth{display:flex;gap:8px}.admin-auth input{width:250px;border:1px solid #dcdfe3;border-radius:12px;padding:11px 12px}.admin-auth button,.reply-form button{border:0;border-radius:12px;background:#ff6818;color:#fff;font-weight:800;padding:11px 16px;cursor:pointer}.inbox{display:grid;grid-template-columns:330px 1fr;min-height:650px;border:1px solid #e2e4e7;border-radius:22px;overflow:hidden;background:#fff;box-shadow:0 18px 50px rgba(31,35,43,.07)}.conversation-list{border-right:1px solid #e7e9ec;background:#fbfbfc;overflow:auto}.conversation-item{width:100%;border:0;border-bottom:1px solid #eceef0;background:transparent;padding:15px;text-align:left;cursor:pointer}.conversation-item.active{background:#fff4ed}.conversation-item.unread .name:after{content:'';display:inline-block;width:8px;height:8px;border-radius:50%;background:#ff6818;margin-left:7px}.conversation-item .top{display:flex;justify-content:space-between;gap:8px}.conversation-item .name{font-weight:800}.conversation-item time{font-size:11px;color:#999fa7}.conversation-item p{margin:6px 0 0;color:#747b84;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.thread{display:flex;flex-direction:column;min-width:0}.thread-head{padding:16px 18px;border-bottom:1px solid #e8eaed}.thread-head h2{margin:0;font-size:18px}.thread-head p{margin:4px 0 0;font-size:12px;color:#8a919a}.messages{flex:1;overflow:auto;padding:20px;background:#f4f6f8}.msg-row{display:flex;margin:9px 0}.msg-row.admin{justify-content:flex-end}.msg{max-width:72%;padding:11px 13px;border-radius:17px;background:#fff;border:1px solid #e3e6e9}.msg-row.admin .msg{background:#ff6b20;color:#fff;border-color:#ff6b20}.msg small{display:block;font-size:10px;opacity:.7;margin-bottom:4px}.msg p{margin:0;line-height:1.45;white-space:pre-wrap;overflow-wrap:anywhere}.msg time{display:block;text-align:right;margin-top:5px;font-size:9px;opacity:.6}.reply-form{display:flex;gap:8px;padding:14px;border-top:1px solid #e7e9ec;background:#fff}.reply-form textarea{flex:1;min-height:48px;max-height:120px;border:1px solid #dcdfe3;border-radius:13px;padding:11px;resize:vertical}.empty{padding:50px 20px;text-align:center;color:#8c939c}.thread-empty{display:grid;place-items:center;flex:1;color:#9298a0}@media(max-width:760px){.admin-shell{padding:12px}.admin-head{align-items:flex-start;flex-direction:column}.admin-auth{width:100%}.admin-auth input{flex:1;width:auto}.inbox{grid-template-columns:1fr;min-height:720px}.conversation-list{max-height:250px;border-right:0;border-bottom:1px solid #e7e9ec}.msg{max-width:82%}}</style></head><body><main class="admin-shell"><div class="admin-head"><div><h1>Support Inbox</h1><p>Оқушылармен бір чат ішінде сөйлесу.</p></div><div class="admin-auth"><input id="adminToken" type="password" placeholder="Admin token"><button id="loginBtn">Кіру</button></div></div><section class="inbox"><aside class="conversation-list" id="conversationList"><div class="empty">Admin token енгізіңіз.</div></aside><section class="thread"><div id="threadHead" class="thread-head" hidden></div><div class="messages" id="threadMessages"><div class="thread-empty">Чатты таңдаңыз.</div></div><form class="reply-form" id="replyForm" hidden><textarea id="replyInput" maxlength="1500" placeholder="Жауап жазыңыз..."></textarea><button type="submit">Жіберу</button></form></section></section></main><script src="./admin-support.js?v=20260823-chat2"></script></body></html>
