<!doctype html>
<html lang="kk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>JUZDEREK — Үздіктер тақтасы</title>
<link rel="stylesheet" href="./site-header.css?v=20260819-lb-page-1">
<link rel="stylesheet" href="./leaderboard-page.css?v=20260819-lb-page-1">
</head>
<body>
<header class="site-header">
  <div class="site-header-inner">
    <a class="site-brand" href="index.html"><span class="site-logo-mark"></span><span class="site-brand-text">JUZDEREK</span></a>
    <nav class="site-nav">
      <a class="site-nav-link" href="index.html">Басты бет</a>
      <a class="site-nav-link" href="periods.html">Кезеңдер</a>
      <a class="site-nav-link active" href="leaderboard.html">Үздіктер</a>
    </nav>
    <a class="lb-back" href="periods.html">← Артқа</a>
  </div>
</header>
<main class="lb-shell">
  <section class="lb-hero">
    <div><span class="lb-kicker">ОСЫ АПТА</span><h1>Үздіктер тақтасы</h1><p>XP бойынша үздік оқушылар рейтингі</p></div>
    <img src="./assets/assets%3Aleague%3A%D1%81up.webp" alt="Кубок">
  </section>
  <section class="lb-card">
    <div class="lb-podium" id="podium"></div>
    <div class="lb-head"><span>Орын</span><span>Оқушы</span><span>Атақ</span><span>XP</span></div>
    <div class="lb-list" id="leaderList"></div>
    <div class="lb-note">Рейтинг қазір демо режимінде. Сенің XP-ың осы браузердегі прогрессіңнен алынады.</div>
  </section>
</main>
<script>
(()=>{
const demo=[['Айбар',2840,'Тарихшы'],['Аружан',2610,'Тарихшы'],['Нұрасыл',2430,'Сарапшы'],['Диас',2210,'Сарапшы'],['Айша',2050,'Сарапшы'],['Медина',1980,'Білгір'],['Нұрбек',1840,'Білгір'],['Алина',1760,'Білгір'],['Әлихан',1680,'Білгір'],['Кәусар',1590,'Білгір'],['Дамир',1490,'Зерттеуші'],['Мерей',1410,'Зерттеуші'],['Санжар',1320,'Зерттеуші'],['Жансая',1240,'Зерттеуші'],['Рауан',1160,'Ізденуші']];
let p={xp:0};try{p=JSON.parse(localStorage.getItem('juzderek_game_progress')||'{"xp":0}')}catch{}
const xp=Number(p.xp)||0,name=localStorage.getItem('juzderek_username')||'Сен';
const rank=xp>=38000?'Аңыз':xp>=20000?'Тарихшы':xp>=9500?'Сарапшы':xp>=3500?'Білгір':xp>=1200?'Зерттеуші':'Ізденуші';
const all=demo.map(x=>({name:x[0],xp:x[1],rank:x[2]}));all.push({name,xp,rank,me:true});all.sort((a,b)=>b.xp-a.xp);
const top3=all.slice(0,3);document.getElementById('podium').innerHTML=top3.map((r,i)=>`<div class="podium-card p${i+1}"><span>${['🥇','🥈','🥉'][i]}</span><strong>${r.name}${r.me?' <em>СЕН</em>':''}</strong><small>${r.rank}</small><b>${r.xp.toLocaleString('kk-KZ')} XP</b></div>`).join('');
document.getElementById('leaderList').innerHTML=all.slice(0,15).map((r,i)=>`<div class="lb-row${r.me?' me':''}"><span class="place">${i+1}</span><strong>${r.name}${r.me?' <em>СЕН</em>':''}</strong><span>${r.rank}</span><b>${r.xp.toLocaleString('kk-KZ')} XP</b></div>`).join('');
})();
</script>
</body>
</html>
