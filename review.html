<!doctype html><html lang="kk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>JUZDEREK — Күндік 10</title><link rel="stylesheet" href="./styles.css"><link rel="stylesheet" href="./site-header.css"><style>
:root{--orange:#ff641e;--orange2:#ff7a2f;--ink:#171d29;--muted:#7b8495;--cream:#fff7ef;--line:#f1e5da;--bg:#fffaf6}
body{background:linear-gradient(180deg,#fff 0,#fffaf6 100%);color:var(--ink)}
.review-shell{max-width:980px;margin:0 auto;padding:46px 20px 70px}.review-head{margin-bottom:26px}.review-head a{color:#7c8492;text-decoration:none;font-weight:600}.review-head h1{font-size:42px;margin:18px 0 6px;letter-spacing:-1px}.review-head h1 span{color:var(--orange)}.review-head p{color:#858d9c;font-size:17px}.review-card{background:#fff;border:1px solid var(--line);border-radius:30px;padding:34px;box-shadow:0 20px 55px rgba(65,40,20,.07);position:relative;overflow:hidden}.review-card:before{content:"";position:absolute;left:0;top:0;width:100%;height:5px;background:linear-gradient(90deg,var(--orange),#ff9a5f)}.review-meta{display:flex;justify-content:space-between;color:#8b93a1;font-size:14px}.review-progress{height:8px;background:#f6eee8;border-radius:99px;margin:18px 0 4px;overflow:hidden}.review-progress span{display:block;height:100%;background:linear-gradient(90deg,var(--orange),var(--orange2));border-radius:99px}.review-date{font-size:34px;font-weight:800;margin:38px 0;text-align:center;letter-spacing:-.5px}.review-answer{display:none;padding:24px;border-radius:20px;background:var(--cream);border:1px solid #ffe0ca;font-size:18px;line-height:1.55;margin:18px 0;color:#3b2d24}.review-answer.show{display:block}.review-actions{display:flex;gap:12px;margin-top:18px}.review-actions button,.show-btn{flex:1;border:0;border-radius:17px;padding:17px;font-weight:800;cursor:pointer;font-size:15px}.primary,.show-btn{background:linear-gradient(135deg,var(--orange),var(--orange2));color:#fff;box-shadow:0 10px 22px rgba(255,100,30,.18)}.soft{background:#fff3ea;color:#bd5724;border:1px solid #ffd8c1!important}.done{text-align:center;padding:48px 20px}.done-mark{width:66px;height:66px;border-radius:50%;display:grid;place-items:center;margin:0 auto 18px;background:#fff0e6;color:var(--orange);font-size:30px;font-weight:900}.done h2{font-size:30px;margin:0 0 10px}.done p{color:#7f8795;max-width:560px;margin:0 auto}.done a{display:inline-block;margin-top:22px;padding:15px 24px;border-radius:16px;background:linear-gradient(135deg,var(--orange),var(--orange2));color:#fff;text-decoration:none;font-weight:800}.review-kind{display:inline-flex;padding:7px 11px;border-radius:999px;background:#fff1e7;color:#df5d20;font-size:12px;font-weight:800;margin-top:20px}
@media(max-width:600px){.review-shell{padding:28px 14px 50px}.review-card{padding:25px 18px}.review-head h1{font-size:34px}.review-date{font-size:27px;margin:30px 0}.review-actions{flex-direction:column}}
</style></head><body><main class="review-shell"><div class="review-head"><a href="periods.html">← Кезеңдерге қайту</a><h1>Күндік <span>10</span></h1><p>Әлсіз мәліметтеріңді аз-аздан бекіт.</p></div><section class="review-card" id="card"></section></main><script src="./progress-core.js?v=20260825-core1"></script><script src="./daily-review.js?v=20260825-mistakes1"></script><script>(()=>{const host=document.getElementById('card');let session=JUZ_DAILY_REVIEW.todaySet().slice(),i=0;const total=session.length;function label(x){return x.kind==='person'?'ТҰЛҒА':x.kind==='fact'?'ДАТА ЖӘНЕ ОҚИҒА':'ҚАЙТАЛАУ'}function finish(){host.innerHTML='<div class="done"><div class="done-mark">✓</div><h2>Бүгінгі қайталау аяқталды!</h2><p>Керемет! Бүгінгі мәліметтердің бәрін қарап шықтың. Қайта бекіту керек дәйектер жүйе белгілеген уақытта қайта келеді.</p><a href="periods.html">Кезеңдерге қайту</a></div>'}function draw(){if(!total||i>=total){finish();return}const x=session[i];const pct=Math.round(i/total*100);const prompt=x.prompt||x.date||'Мәліметті есіңе түсір';const answer=x.answer||x.event||'';host.innerHTML=`<div class="review-meta"><span>Бүгінгі қайталау</span><b>${i+1} / ${total}</b></div><div class="review-progress"><span style="width:${pct}%"></span></div><span class="review-kind">${label(x)}</span><div class="review-date">${prompt}</div><button class="show-btn" id="show">Жауабын көрсету</button><div class="review-answer" id="answer">${answer}</div><div class="review-actions" id="actions" hidden><button class="soft" data-known="0">Тағы қайталаймын</button><button class="primary" data-known="1">Білемін</button></div>`;document.getElementById('show').onclick=()=>{document.getElementById('answer').classList.add('show');document.getElementById('actions').hidden=false;document.getElementById('show').hidden=true};host.querySelectorAll('[data-known]').forEach(b=>b.onclick=()=>{JUZ_DAILY_REVIEW.answer(x.key,b.dataset.known==='1');i++;draw()})}draw()})();</script></body></html>
