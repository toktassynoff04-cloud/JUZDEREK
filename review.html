<!doctype html><html lang="kk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>JUZDEREK — Күндік 10</title><link rel="stylesheet" href="./styles.css"><link rel="stylesheet" href="./site-header.css"><style>body{background:#f6f8fb}.review-shell{max-width:900px;margin:0 auto;padding:48px 20px}.review-head{margin-bottom:24px}.review-head a{color:#667085;text-decoration:none}.review-head h1{font-size:34px;margin:16px 0 8px}.review-head p{color:#667085}.review-card{background:#fff;border:1px solid #e8edf3;border-radius:28px;padding:34px;box-shadow:0 18px 50px rgba(30,50,80,.07)}.review-meta{display:flex;justify-content:space-between;color:#667085;font-size:14px}.review-date{font-size:30px;font-weight:800;margin:38px 0;text-align:center}.review-answer{display:none;padding:24px;border-radius:18px;background:#f5f8fc;font-size:18px;line-height:1.55;margin:18px 0}.review-answer.show{display:block}.review-actions{display:flex;gap:12px;margin-top:24px}.review-actions button{flex:1;border:0;border-radius:16px;padding:16px;font-weight:700;cursor:pointer}.primary{background:#111827;color:#fff}.soft{background:#eef2f7;color:#273142}.done{text-align:center;padding:55px 20px}.done h2{font-size:30px}.done a{display:inline-block;margin-top:18px;padding:14px 20px;border-radius:14px;background:#111827;color:#fff;text-decoration:none}@media(max-width:600px){.review-shell{padding:28px 14px}.review-card{padding:24px 18px}.review-head h1{font-size:28px}.review-actions{flex-direction:column}}</style></head><body><main class="review-shell"><div class="review-head"><a href="periods.html">← Кезеңдерге қайту</a><h1>Күндік 10</h1><p>Әлсіз мәліметтеріңді аз-аздан бекіт.</p></div><section class="review-card" id="card"></section></main><script src="./progress-core.js?v=20260825-core1"></script><script src="./daily-review.js?v=20260825-review1"></script><script>(()=>{let items=JUZ_DAILY_REVIEW.todaySet(),i=0;const host=document.getElementById('card');function draw(){items=JUZ_DAILY_REVIEW.todaySet();if(!items.length){host.innerHTML='<div class="done"><h2>Бүгінгі қайталау аяқталды ✓</h2><p>Жарайсың! Келесі қайталау уақыты келгенде жаңа мәліметтер осында шығады.</p><a href="periods.html">Оқуды жалғастыру</a></div>';return}if(i>=items.length)i=0;const x=items[i];host.innerHTML=`<div class="review-meta"><span>Бүгінгі қайталау</span><b>${i+1} / ${items.length}</b></div><div class="review-date">${x.date||'Мәліметті есіңе түсір'}</div><button class="primary" id="show" style="width:100%;border:0;border-radius:16px;padding:16px;font-weight:700">Жауабын көрсету</button><div class="review-answer" id="answer">${x.event||''}</div><div class="review-actions" id="actions" hidden><button class="soft" data-known="0">Тағы қайталаймын</button><button class="primary" data-known="1">Білемін</button></div>`;document.getElementById('show').onclick=()=>{document.getElementById('answer').classList.add('show');document.getElementById('actions').hidden=false;document.getElementById('show').hidden=true};host.querySelectorAll('[data-known]').forEach(b=>b.onclick=()=>{JUZ_DAILY_REVIEW.answer(x.key,b.dataset.known==='1');i++;draw()})}draw()})();</script></body></html>
