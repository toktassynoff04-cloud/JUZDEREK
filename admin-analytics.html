<!doctype html><html lang="kk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>JUZDEREK — Analytics</title><style>body{margin:0;background:#f7f8fa;color:#202631;font-family:Arial,sans-serif}.shell{max-width:1180px;margin:auto;padding:32px}.top{display:flex;justify-content:space-between;gap:16px;align-items:center;margin-bottom:24px}.brand{font-weight:900;font-size:26px}.brand span{color:#ff6818}.auth{display:flex;gap:8px}.auth input{min-width:260px;padding:12px 14px;border:1px solid #e3e5e8;border-radius:14px}.auth button,.refresh{border:0;border-radius:14px;background:#ff6818;color:#fff;font-weight:800;padding:12px 16px;cursor:pointer}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.stat,.panel{background:#fff;border:1px solid #ececef;border-radius:22px;box-shadow:0 10px 30px rgba(30,35,45,.05)}.stat{padding:20px}.stat small{color:#8e96a2;font-weight:700}.stat b{display:block;font-size:30px;margin-top:9px}.panel{margin-top:18px;padding:20px}.panel-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}.panel h2{margin:0;font-size:19px}.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse;font-size:13px}th,td{text-align:left;padding:12px;border-bottom:1px solid #f0f1f3;white-space:nowrap}th{color:#8e96a2;font-size:11px;text-transform:uppercase}.active{display:inline-block;width:8px;height:8px;border-radius:50%;background:#2fbd77;margin-right:7px}.muted{color:#9299a4}.empty{padding:40px;text-align:center;color:#9299a4}.error{color:#d94747;margin-top:10px;font-size:13px}@media(max-width:760px){.shell{padding:18px}.top{align-items:flex-start;flex-direction:column}.auth{width:100%}.auth input{min-width:0;flex:1}.stats{grid-template-columns:1fr 1fr}.stat b{font-size:24px}}</style></head><body><main class="shell"><div class="top"><div><div class="brand"><span>JUZ</span>DEREK Analytics</div><div class="muted">Оқушылардың жеңіл usage метрикасы</div></div><div
