<!doctype html><html lang="kk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>JUZDEREK — Жетістіктер</title><link rel="stylesheet" href="./site-header.css"><link rel="stylesheet" href="./profile-menu.css"><link rel="stylesheet" href="./juzderek-ui-system.css?v=20260823-1"><link rel="stylesheet" href="./achievements.css?v=20260823-1"><link rel="stylesheet" href="./achievements-mobile.css?v=20260823-2"><link rel="stylesheet" href="./real-stats-progress.css?v=20260819-final"></head><body><header class="site-header" data-site-header></header><main class="ach-shell"><section class="ach-hero"><div class="hero-copy"><span class="ach-kicker">СЕНІҢ КОЛЛЕКЦИЯҢ</span><h1>Жетістіктер</h1><p>Белгілер оңай ашылмайды: тұрақтылық, дәлдік, ұзақ мерзімді прогресс және толық меңгеру арқылы жиналады.</p></div><div class="hero-progress"><div class="hero-count"><strong id="collectionCount">0 / 20</strong><span>ашылды</span></div><div class="collection-track"><span id="collectionFill"></span><img id="progressMascot" src="./assets/achievement-mascot.webp" alt=""></div><div class="milestone-row"><small id="nextMilestone">Келесі белгіге прогресс</small><small id="milestoneValue">5 000 XP</small></div><div class="hero-stats"><div><img src="./assets/stat-trophy.svg" alt=""><span>Жалпы XP<b id="statXp">0</b></span></div><div><img src="./assets/stat-flame.svg" alt=""><span>Ең ұзақ streak<b id="statStreak">0 күн</b></span></div><div><img src="./assets/stat-target.svg" alt=""><span>Дұрыс жауап<b id="statAccuracy">0%</b></span></div></div></div></section><section class="toolbar"><div class="filters" id="filters"><button class="active" data-filter="all">Барлығы</button><button data-filter="rare"><i class="dot rare"></i>Rare</button><button data-filter="epic"><i class="dot epic"></i>Epic</button><button data-filter="legendary"><i class="dot legendary"></i>Legendary</button></div><div class="toolbar-right"><select id="sortSelect" aria-label="Сұрыптау"><option value="rarity">Сиректігі бойынша</option><option value="progress">Прогресс бойынша</option><option value="name">Атауы бойынша</option></select><div class="view-switch"><button class="active" id="gridView" aria-label="Тор көрінісі">▦</button><button id="listView" aria-label="Тізім көрінісі">☰</button></div></div></section><section class="badge-grid" id="badgeGrid"></section><div class="ach-footer">✦ Әр күнгі кішкентай қадам – үлкен жетістікке бастайды!</div></main><div class="detail-backdrop" id="detailBackdrop"><div class="detail-card"><button class="detail-close" id="detailClose" aria-label="Жабу">×</button><img id="detailImage" alt=""><span class="detail-rarity" id="detailRarity"></span><h2 id="detailTitle"></h2><p id="detailText"></p><div class="detail-progress"><span><i id="detailFill"></i></span><b id="detailValue"></b></div></div></div><script src="./site-header-component.js?v=20260823-mobile-nav"></script><script src="./real-stats-progress.js?v=20260819-final"></script><script src="./achievements-system.js?v=20260823-1"></script><script>(()=>{let filter='all',sort='rarity',view='grid';const rarityRank={rare:1,epic:2,legendary:3};const grid=document.getElementById('badgeGrid');const clamp=(n,min,max)=>Math.max(min,Math.min(max,n));const value=(a,s)=>+s[a.type]||0;const pct=(a,s)=>clamp(Math.round(value(a,s)/a.target*100),0,100);const fmt=n=>new Intl.NumberFormat('kk-KZ').format(n);function render(){const s=window.JUZ_ACH_STATE?JUZ_ACH_STATE():{},items=[...(window.JUZ_ACHIEVEMENTS||[])],visible=items.filter(a=>filter==='all'||a.r===filter);visible.sort((a,b)=>sort==='name'?a.n.localeCompare(b.n,'kk'):sort==='progress'?pct(b,s)-pct(a,s):rarityRank[a.r]-rarityRank[b.r]);grid.classList.toggle('list-view',view==='list');grid.innerHTML=visible.map(a=>{const v=value(a,s),p=pct(a,s),open=v>=a.target;return `<button class="badge ${open?'unlocked':'locked'}" data-id="${a.id}" data-rarity="${a.r}"><span class="rarity">${a.r.toUpperCase()}</span><div class="badge-art"><img src="./assets/${a.img}" alt=""></div><div class="badge-copy"><h3>${a.n}</h3><p>${a.d}</p>${open?`<small class="earned">Ашылды</small>`:`<div class="badge-progress"><span class="mini-track"><i style="width:${p}%"></i></span><b>${fmt(Math.min(v,a.target))} / ${fmt(a.target)}</b></div>`}</div>${open?'':'<span class="lock-mark">⌑</span>'}</button>`}).join('');grid.querySelectorAll('.badge').forEach(el=>el.onclick=()=>openDetail(items.find(a=>a.id===el.dataset.id),s));const opened=items.filter(a=>value(a,s)>=a.target).length;document.getElementById('collectionCount').textContent=`${opened} / ${items.length}`;document.getElementById('collectionFill').style.width=`${opened/items.length*100}%`;document.getElementById('progressMascot').style.left=`calc(${clamp(opened/items.length*100,3,97)}% - 17px)`;document.getElementById('statXp').textContent=fmt(s.xp||0);document.getElementById('statStreak').textContent=`${s.streak||0} күн`;document.getElementById('statAccuracy').textContent=`${s.avgPct||0}%`;const next=items.filter(a=>value(a,s)<a.target).sort((a,b)=>(a.target-value(a,s))-(b.target-value(b,s)))[0];document.getElementById('nextMilestone').textContent=next?`Келесі белгі: ${next.n}`:'Барлық жетістік ашылды';document.getElementById('milestoneValue').textContent=next?`${fmt(Math.max(0,next.target-value(next,s)))} қалды`:'20 / 20';}function openDetail(a,s){if(!a)return;const p=pct(a,s),open=value(a,s)>=a.target;document.getElementById('detailImage').src='./assets/'+a.img;document.getElementById('detailTitle').textContent=a.n;document.getElementById('detailText').textContent=a.d;document.getElementById('detailRarity').textContent=a.r.toUpperCase();document.getElementById('detailRarity').dataset.rarity=a.r;document.getElementById('detailFill').style.width=p+'%';document.getElementById('detailValue').textContent=open?'Ашылды':`${fmt(Math.min(value(a,s),a.target))} / ${fmt(a.target)}`;document.getElementById('detailBackdrop').classList.add('show')}document.getElementById('detailClose').onclick=()=>document.getElementById('detailBackdrop').classList.remove('show');document.getElementById('detailBackdrop').onclick=e=>{if(e.target.id==='detailBackdrop')e.currentTarget.classList.remove('show')};document.getElementById('filters').onclick=e=>{const b=e.target.closest('button');if(!b)return;filter=b.dataset.filter;document.querySelectorAll('#filters button').forEach(x=>x.classList.toggle('active',x===b));render()};document.getElementById('sortSelect').onchange=e=>{sort=e.target.value;render()};document.getElementById('gridView').onclick=()=>{view='grid';gridView.classList.add('active');listView.classList.remove('active');render()};document.getElementById('listView').onclick=()=>{view='list';listView.classList.add('active');gridView.classList.remove('active');render()};window.addEventListener('juzderek:achievements',render);window.addEventListener('load',render);})();</script></body></html>
