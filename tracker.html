<header class="site-header" data-site-header></header>
<main class="tracker-shell">
  <section class="tracker-head">
    <div><h1>Тақырып трекері</h1><p>Оқу прогресіңді бақылап, мақсатқа жақында!</p></div>

      <section class="tracker-panel" id="overallPanel"><div class="panel-title"><h3>Жалпы прогресс</h3></div><div id="overallProgress"></div></section>

  </div>
